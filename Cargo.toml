[package]
name = "aod-lint"
version = "0.1.0"
edition = "2021"
authors = ["Reginald Poyau"]
description = "Axiomatic Fundamentalism & D.E.C. Linter/Compiler for Typst"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst-syntax = "0.13"
regex = "1.10"
colored = "2.1"
sha2 = "0.10"
