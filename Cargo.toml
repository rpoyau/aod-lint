[package]
name = "aod-lint"
version = "0.2.0"
edition = "2021"
authors = ["Reginald Poyau"]
license = "MIT"
description = "Executable verification compiler and treatise linter for the Axiomatic Fundamentalism (AF), AFC, and AOD protocols"
readme = "README.md"
repository = "https://github.com/rpoyau/aod-lint"
keywords = ["axiomatic", "verification", "typst", "latex", "linter"]
categories = ["command-line-utilities", "compilers", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst-syntax = "0.13"
regex = "1.10"
colored = "2.1"
sha2 = "0.10"
